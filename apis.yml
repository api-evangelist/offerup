aid: offerup
name: OfferUp
description: >-
  OfferUp is a mobile-first local marketplace where people buy and sell items in
  their community across categories including electronics, vehicles, furniture,
  clothing, and collectibles. Founded in 2011 and headquartered in Bellevue,
  Washington, OfferUp reports more than 40 million active users and around 30
  million transactions annually, and merged with letgo in 2020 to become one of
  the largest recommerce platforms in the United States. The company operates
  consumer iOS and Android apps and a website but does not publish a public
  developer program, partner API, or API documentation. This profile was
  surfaced as a venture-capital portfolio company (a16z, GGV Capital) and
  enriched with an identity and domain-security pass; no public API surface was
  found.
